<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="cancel()">Cancel</ion-button>
    </ion-buttons>
    <ion-title>Log Sleepiness</ion-title>
    <ion-buttons slot="end">
      <!-- disable Save until a level is picked -->
      <ion-button (click)="save()" [disabled]="sleepiness === undefined" [strong]="true">Save</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item>
      <ion-label>Time</ion-label>
      <ion-datetime-button datetime="loggedAt"></ion-datetime-button>
    </ion-item>
  </ion-list>

  <!-- all 7 levels with descriptions, so no one has to remember what each number means -->
  <ion-list>
    <ion-list-header>How sleepy do you feel?</ion-list-header>
    <ion-radio-group [(ngModel)]="sleepiness">
      @for (level of levels; track level) {
        <ion-item>
          <ion-radio [value]="level" class="ion-text-wrap" justify="space-between">
            <strong>{{ level }}</strong> &nbsp; {{ descriptions[level] }}
          </ion-radio>
        </ion-item>
      }
    </ion-radio-group>
  </ion-list>

  <!-- optional note; maxlength keeps it short so it fits on the cards (error prevention) -->
  <ion-list>
    <ion-item>
      <ion-textarea label="Note (optional)" labelPlacement="stacked" [(ngModel)]="note"
        placeholder="e.g. after 8am lecture, had coffee" [maxlength]="100" [counter]="true" [autoGrow]="true"></ion-textarea>
    </ion-item>
  </ion-list>

  <!-- time picker that pops up when the time button is tapped -->
  <ion-modal [keepContentsMounted]="true">
    <ng-template>
      <ion-datetime id="loggedAt" [(ngModel)]="loggedAt" [max]="now"></ion-datetime>
    </ng-template>
  </ion-modal>
</ion-content>
