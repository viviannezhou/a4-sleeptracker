<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>History</ion-title>
  </ion-toolbar>
  <!-- filter between all logs, just nights, or just check-ins -->
  <ion-toolbar>
    <ion-segment [(ngModel)]="filter">
      <ion-segment-button value="all"><ion-label>All</ion-label></ion-segment-button>
      <ion-segment-button value="sleep"><ion-label>Sleep</ion-label></ion-segment-button>
      <ion-segment-button value="sleepiness"><ion-label>Sleepiness</ion-label></ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  @if (logs.length === 0) {
    <p class="ion-padding ion-text-center">Nothing logged yet.</p>
  }

  <ion-list>
    @for (log of logs; track log.id) {
      <!-- swipe left to reveal the delete button (iOS convention) -->
      <ion-item-sliding>
        <ion-item>
          <ion-icon slot="start" [name]="isOvernight(log) ? 'bed-outline' : 'cafe-outline'"></ion-icon>
          <ion-label class="ion-text-wrap">
            <h3>{{ log.dateString() }}</h3>
            <p>{{ log.summaryString() }}</p>
            @if (log.note) {
              <p class="note">"{{ log.note }}"</p>
            }
          </ion-label>
        </ion-item>
        <ion-item-options side="end">
          <ion-item-option color="danger" (click)="deleteLog(log)">
            <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
          </ion-item-option>
        </ion-item-options>
      </ion-item-sliding>
    }
  </ion-list>
</ion-content>
