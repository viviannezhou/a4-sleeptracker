<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Blank
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Blank</ion-title>
    </ion-toolbar>
  </ion-header>

    <!-- temporary: shows every log so we can test that storage works -->
  <ion-button (click)="addTestLog()">Add test log</ion-button>
  <ion-button (click)="openLogSleep()">Log last night</ion-button>
  <ion-button (click)="openLogSleepiness()">How sleepy are you?</ion-button>
  <ion-list>
    @for (log of allSleepData; track log.id) {
      <ion-item>
        <ion-label>
          <h3>{{ log.dateString() }}</h3>
          <p>{{ log.summaryString() }}</p>
        </ion-label>
      </ion-item>
    }
  </ion-list>
</ion-content>
